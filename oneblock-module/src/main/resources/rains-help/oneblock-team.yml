id: oneblock-team
title: OneBlock team & invites
summary: Bring friends onto your island, invite guests, answer invites from any server, leave or kick.
intro: |
  A block shared is a block halved, but it breaks twice as fast. Here is how a team forms.
icon: PLAYER_HEAD
category: Games
order: 31
module: oneblock
aliases: [invite, guest, accept, deny, kick, leave, team]
keywords: [team, invite, guest, visit, friends, owner, member, ban]
related: [oneblock]
sections:
  - question: How do I invite someone to my team?
    title: Team invite
    text: |
      {cmd:/island invite <player>} invites somebody to join. They can be on <i>any</i> server of the network — they get a message with [Join] and [No thanks] buttons. It stays open for <white>{setting:oneblock:invite-minutes|minutes}</white>, then runs out and you are told.

      Normally only the owner invites to the team (the island can allow more); everybody on the team can bring guests. The invitee's message tells them which money your island plays with before they say yes.
  - question: How do I let someone visit?
    title: Guest invite
    text: |
      {cmd:/island guest <player>} invites somebody just to look round. They accept and are taken to your island; they are not on the team. A guest invite is open <white>{setting:oneblock:invite-minutes|minutes}</white> as well.
  - question: How do I answer an invite?
    title: Accepting and declining
    text: |
      Click [Join]/[Visit] or [No thanks], or type {cmd:/island accept [player]} and {cmd:/island deny [player]}. With several invites waiting, say whose. Accepting works from any server and takes you across.
  - question: Why was my invite refused?
    title: Refusals
    text: |
      Inviting yourself, no island of your own, the invitee already on your island or banned by you, only the owner may invite to the team, your team is full, nobody with that name online anywhere on the network, or the island server not answering right now. The message names the reason.
  - question: Can I join while I own an island?
    title: Joining another island
    text: |
      One island per person. If you have your own, give it up first with {cmd:/island leave}; if you are on another team, leave it first. The team size is limited; the team page of the island menu shows the places taken.
  - question: How do I kick someone?
    title: Kicking
    text: |
      The owner types {cmd:/island kick <player>} or clicks a member's head in {run:/island team}. They lose access to the island; if they are standing on it they are sent to the waiting world. You can invite them again later.
  - question: How do I leave?
    title: Leaving
    text: |
      {cmd:/island leave} (with a confirmation). A member leaves the team. An owner alone gives the island up — it is <b>kept</b>, not deleted, but nobody plays it any more. An owner with a team cannot leave: kick them first, an island needs an owner.
